<!DOCTYPE html>
<html>
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <h1>Общий счет: <span id="total-score">0</span></h1>
    <button id="click-btn">Кликнуть!</button>

<script>
    const scoreEl = document.getElementById('score'); // ID твоего элемента с цифрой
    const btn = document.getElementById('click-btn'); // ID твоей кнопки

    async function loadScore() {
        try {
            const res = await fetch('/api/score');
            const data = await res.json();
            scoreEl.innerText = data.count;
        } catch (e) { console.log("Ошибка загрузки:", e); }
    }

    btn.addEventListener('click', async () => {

        if (window.Telegram.WebApp.HapticFeedback) {
            window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }

        try {
            const res = await fetch('/api/score', { method: 'POST' });
            const data = await res.json();
            scoreEl.innerText = data.count; // Обновляем экран числом из базы
        } catch (e) { console.log("Ошибка клика:", e); }
    });

    loadScore(); 
</script>
</body>
</html>
