<!DOCTYPE html>
<html>
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="score">0</div>
    <button id="click-btn">Клик!</button>

    <script>
        window.Telegram.WebApp.ready();
        const scoreEl = document.getElementById('score');
        const btn = document.getElementById('click-btn');

        const API_URL = 'https://api-eight-gamma-38.vercel.app'; 

        async function update(method = 'GET') {
            try {
                const res = await fetch(API_URL + '/api/score', { method });
                const data = await res.json();
                scoreEl.innerText = data.count;
            } catch (e) {
                scoreEl.innerText = "Err: " + e.message;
            }
        }

        btn.onclick = () => update('POST');
        update('GET');
    </script>
</body>
</html>
