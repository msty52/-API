<!DOCTYPE html>
<html>
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <h1>Общий счет: <span id="total-score">0</span></h1>
    <button id="click-btn">Кликнуть!</button>

    <script>
        const tg = window.Telegram.WebApp;
        const btn = document.getElementById('click-btn');
        const scoreEl = document.getElementById('total-score');

        // Твой сервер (после деплоя на Render/Railway)
        const SERVER_URL = 'https://твой-сервер.onrender.com';

        btn.addEventListener('click', async () => {
            const response = await fetch(`${SERVER_URL}/click`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: tg.initDataUnsafe.user.id })
            });
            const data = await response.json();
            scoreEl.innerText = data.totalScore;
        });
    </script>
</body>
</html>
